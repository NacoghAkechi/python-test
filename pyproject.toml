[project]
name = "gas"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["django>=5.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gas"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "gas.web.settings"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "integration: integration test dùng DB thật",
    "e2e: test dựng HTTP server rồi chạy xuyên suốt từ bên ngoài",
]

[tool.mutmut]
source_paths = ["src/"]
only_mutate = ["src/gas/campaign.py"]
pytest_add_cli_args_test_selection = ["tests/unit/test_campaign.py"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.13",
    "mutmut==3.8.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    "pytest-django>=4.11.1",
    "pytest-mock>=3.15.1",
]
